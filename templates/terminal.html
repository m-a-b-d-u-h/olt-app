{% extends "base.html" %}
{% block title %}Terminal{% endblock %}
{% block content %}
<style>
.terminal-wrapper { display:flex; flex-direction:column; height:calc(100vh - 90px); margin:-24px -32px; }
.terminal-header { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:#0f0f0f; border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
.terminal-body { flex:1; display:flex; overflow:hidden; }
.terminal-screen { flex:1; background:#0a0a0a; display:flex; flex-direction:column; position:relative; min-height:0; }
#terminal-container { flex:1; overflow:hidden; padding:4px; }
.quick-panel { width:280px; background:#0f0f0f; border-left:1px solid rgba(255,255,255,0.1); padding:12px; overflow-y:auto; flex-shrink:0; }
.quick-panel h3 { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.3); font-weight:700; margin-bottom:12px; }
.quick-grid { display:flex; flex-direction:column; gap:4px; }
.quick-btn { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-radius:6px; border:none; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; transition:all 0.2s; width:100%; text-align:left; }
.quick-btn:not(:disabled) { background:#e2e8f0; color:#0f172a; }
.quick-btn:not(:disabled):hover { background:#cbd5e1; }
.quick-btn:disabled { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.15); cursor:not-allowed; }
@media(max-width:768px){ .quick-panel { display:none; } .terminal-wrapper { margin:-16px; height:calc(100vh - 60px); } }
</style>

<div class="terminal-wrapper">
    <div class="terminal-header">
        <div class="flex items-center gap-2">
            <select id="term-olt" class="form-control" style="width:auto;min-width:180px;font-size:11px;padding:4px 8px;">
                <option value="">-- Select OLT --</option>
                {% for olt in olts %}
                <option value="{{ olt.id }}" data-ip="{{ olt.ip }}" data-user="{{ olt.username }}" data-pass="{{ olt.password }}">{{ olt.name }}</option>
                {% endfor %}
            </select>
            <span class="badge badge-offline" id="term-status">disconnected</span>
        </div>
        <div class="flex items-center gap-2">
            <button class="btn btn-primary btn-sm" onclick="connectTerminal()" id="connect-btn">Connect</button>
            <button class="btn btn-secondary btn-sm" onclick="disconnectTerminal()" id="disconnect-btn" style="display:none;">Disconnect</button>
        </div>
    </div>
    <div class="terminal-body">
        <div class="terminal-screen">
            <div id="terminal-container"></div>
        </div>
        <div class="quick-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 style="margin:0;">Quick Ops</h3>
                <button onclick="addQuickCmd()" style="background:none;border:none;color:#60a5fa;font-size:18px;cursor:pointer;padding:0 4px;" title="Add Command">+</button>
            </div>
            <div class="quick-grid" id="quick-grid"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function() {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css';
    document.head.appendChild(link);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script>
let socket = null;
let connected = false;
let term = null;

let QUICK_CMDS = [];

async function loadQuickCmds() {
    const res = await fetch('/api/quick-commands');
    QUICK_CMDS = await res.json();
    renderQuickCmds();
}

function renderQuickCmds() {
    const grid = document.getElementById('quick-grid');
    grid.innerHTML = QUICK_CMDS.map(c =>
        `<div style="display:flex;gap:4px;align-items:stretch;">
            <button class="quick-btn" id="q-${c.id}" onclick="runQuick('${c.id}')" disabled style="flex:1;">${c.label}</button>
            <button class="quick-btn" onclick="editQuickCmd('${c.id}')" disabled style="width:28px;padding:4px;font-size:11px;flex:none;" id="qe-${c.id}" title="Edit">✎</button>
            <button class="quick-btn" onclick="deleteQuickCmd('${c.id}')" disabled style="width:28px;padding:4px;font-size:11px;flex:none;" id="qd-${c.id}" title="Delete">✕</button>
        </div>`
    ).join('');
}

async function editQuickCmd(id) {
    const cmd = QUICK_CMDS.find(c => c.id === id);
    if (!cmd) return;
    const label = prompt('Label:', cmd.label);
    if (!label) return;
    const cmdsStr = prompt('Commands (one per line):', cmd.commands.join('\n'));
    if (!cmdsStr) return;
    const commands = cmdsStr.split('\n').map(s => s.trim()).filter(Boolean);
    await fetch('/api/quick-commands/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({label, commands}),
    });
    await loadQuickCmds();
    updateQuickBtnState();
}

async function deleteQuickCmd(id) {
    if (!confirm('Hapus command ini?')) return;
    await fetch('/api/quick-commands/' + id, {method: 'DELETE'});
    await loadQuickCmds();
    updateQuickBtnState();
}

async function addQuickCmd() {
    const label = prompt('Label for new command:');
    if (!label) return;
    const cmdsStr = prompt('Commands (one per line):\n\nContoh:\nenable\nconfig\ndisplay vlan all');
    if (!cmdsStr) return;
    const commands = cmdsStr.split('\n').map(s => s.trim()).filter(Boolean);
    await fetch('/api/quick-commands', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({label, commands}),
    });
    await loadQuickCmds();
    updateQuickBtnState();
}

document.getElementById('quick-grid').innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:11px;padding:8px;text-align:center;">Loading...</div>';
loadQuickCmds();

function initTerminal() {
    if (term) { term.dispose(); term = null; }
    term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: "'SF Mono','Fira Code','Cascadia Code',monospace",
        theme: {
            background: '#0a0a0a',
            foreground: '#e2e8f0',
            cursor: '#e2e8f0',
            selectionBackground: '#3b82f644',
            black: '#000000',
            red: '#f87171',
            green: '#4ade80',
            yellow: '#fbbf24',
            blue: '#60a5fa',
            magenta: '#c084fc',
            cyan: '#22d3ee',
            white: '#e2e8f0',
        },
        allowTransparency: false,
        rows: 30,
        cols: 80,
    });
    term.open(document.getElementById('terminal-container'));
    term.write('\r\n\x1b[1;34m[System]\x1b[0m Pilih OLT dan klik Connect untuk memulai.\r\n\r\n');
    term.focus();

    term.onData(function(data) {
        if (!connected || !socket) return;
        socket.emit('terminal:input', data);
    });
}

function connectTerminal() {
    const sel = document.getElementById('term-olt');
    const opt = sel.options[sel.selectedIndex];
    if (!opt || !opt.value) { toast('Select an OLT first', 'error'); return; }

    term.write('\r\n\x1b[1;34m[System]\x1b[0m Connecting to \x1b[33m' + opt.dataset.ip + '\x1b[0m...\r\n');
    document.getElementById('term-status').textContent = 'connecting';
    document.getElementById('term-status').className = 'badge badge-offline';

    socket = io({ transports: ['websocket'], timeout: 30000 });
    socket.on('connect', () => {
        socket.emit('ssh:connect', {
            host: opt.dataset.ip,
            username: opt.dataset.user,
            password: opt.dataset.pass
        });
    });
    socket.on('ssh:connected', () => {
        connected = true;
        document.getElementById('term-status').textContent = 'connected';
        document.getElementById('term-status').className = 'badge badge-online';
        document.getElementById('connect-btn').style.display = 'none';
        document.getElementById('disconnect-btn').style.display = '';
        term.focus();
        updateQuickBtnState();
        term.write('\x1b[1;34m[System]\x1b[0m Connected.\r\n');
    });
    socket.on('ssh:error', (data) => {
        term.write('\r\n\x1b[1;31m[Error]\x1b[0m ' + (data.message || 'Connection failed') + '\r\n');
        toast('Connection failed', 'error');
        disconnectTerminal();
    });
    socket.on('terminal:data', (data) => {
        term.write(data);
    });
    socket.on('disconnect', () => disconnectTerminal());
}

function disconnectTerminal() {
    if (socket) { socket.disconnect(); socket = null; }
    connected = false;
    document.getElementById('term-status').textContent = 'disconnected';
    document.getElementById('term-status').className = 'badge badge-offline';
    document.getElementById('connect-btn').style.display = '';
    document.getElementById('disconnect-btn').style.display = 'none';
    updateQuickBtnState();
    term.write('\r\n\x1b[1;34m[System]\x1b[0m Disconnected.\r\n');
}

function updateQuickBtnState() {
    document.querySelectorAll('.quick-btn').forEach(b => b.disabled = !connected);
}

async function runQuick(id) {
    if (!connected || !socket) return;
    const cmd = QUICK_CMDS.find(c => c.id === id);
    if (!cmd) return;
    const btn = document.getElementById('q-'+id);
    btn.textContent = '...';
    btn.disabled = true;
    document.getElementById('qe-'+id).disabled = true;
    document.getElementById('qd-'+id).disabled = true;
    for (const c of cmd.commands) {
        socket.emit('terminal:input', c + '\n');
        await new Promise(r => setTimeout(r, 1200));
    }
    btn.textContent = cmd.label;
    btn.disabled = !connected;
    document.getElementById('qe-'+id).disabled = !connected;
    document.getElementById('qd-'+id).disabled = !connected;
}

initTerminal();
</script>
{% endblock %}
